name: Build OBS Shape Window

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4

      - name: Get OBS build system
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/obsproject/obs-plugintemplate.git "$env:RUNNER_TEMP\obs-template"

          Copy-Item "$env:RUNNER_TEMP\obs-template\.github" "$env:GITHUB_WORKSPACE\" -Recurse -Force
          Copy-Item "$env:RUNNER_TEMP\obs-template\cmake" "$env:GITHUB_WORKSPACE\" -Recurse -Force
          Copy-Item "$env:RUNNER_TEMP\obs-template\build-aux" "$env:GITHUB_WORKSPACE\" -Recurse -Force
          Copy-Item "$env:RUNNER_TEMP\obs-template\CMakePresets.json" "$env:GITHUB_WORKSPACE\" -Force

      - name: Build plugin
        uses: ./.github/actions/build-plugin
        with:
          target: x64
          config: Release

      - name: Package plugin
        uses: ./.github/actions/package-plugin
        with:
          target: x64
          config: Release
          package: true

      - name: Locate plugin DLL
        shell: pwsh
        run: |
          Write-Host "Searching for obs-shape-window.dll..."

          $dll = Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -Filter "obs-shape-window.dll" `
            -Recurse `
            -File |
            Select-Object -First 1

          if (-not $dll) {
            Write-Error "obs-shape-window.dll was not found."
            exit 1
          }

          Write-Host "DLL found:"
          Write-Host $dll.FullName

          "PLUGIN_DLL=$($dll.FullName)" >> $env:GITHUB_ENV

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress

      - name: Create installer script
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force installer | Out-Null

          @"
          [Setup]
          AppId={{8E5A8B40-6C9A-4F4E-9A15-OBS-SHAPE-WINDOW}}
          AppName=OBS Shape Window
          AppVersion=0.1.0
          AppPublisher=Wong-Zade
          DefaultDirName={autopf}\obs-studio
          DisableProgramGroupPage=yes
          OutputDir=installer
          OutputBaseFilename=OBS-Shape-Window-Setup
          Compression=lzma
          SolidCompression=yes
          ArchitecturesInstallIn64BitMode=x64compatible

          [Files]
          Source: "$env:PLUGIN_DLL"; DestDir: "{app}\obs-plugins\64bit"; Flags: ignoreversion

          [UninstallDelete]
          Type: files; Name: "{app}\obs-plugins\64bit\obs-shape-window.dll"
          "@ | Set-Content installer.iss -Encoding UTF8

      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: OBS-Shape-Window-Installer
          path: installer\OBS-Shape-Window-Setup.exe
